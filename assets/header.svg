<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Tan Wee Joe</title>
  <desc id="desc">Understanding, building, and securing AI systems. A connected network on a dark blue background.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#192b40"/>
    </linearGradient>
